name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: node scripts/build.mjs

      - name: Scan strictly and report PII
        run: node scripts/checks/scan.mjs --strict
        continue-on-error: true
